name: Release notes

# Refreshes the title and notes of an existing release from
# docs/release-notes/<tag>.md on the selected branch (usually main), e.g.
# to add a breaking-change notice after publishing. Assets are untouched.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update, e.g. v2.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Update ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Update release title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version tag: ${TAG_NAME}"
            exit 1
          fi
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          target_sha="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          bash scripts/release-notes.sh "$TAG_NAME" "${TAG_NAME#v}" "$target_sha"
          cat release-title.txt release-notes.md
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md
